name: CI

on:
  pull_request:
    branches: [ MAIN, DEV, PRE, PROD ]
  push:
    branches: [ MAIN, DEV, PRE, PROD ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project files
        id: detect
        run: |
          echo "has_pkg=$( [ -f package.json ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "has_dockerfile=$( [ -f Dockerfile ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Setup Node
        if: steps.detect.outputs.has_pkg == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        if: steps.detect.outputs.has_pkg == 'true'
        run: |
          npm ci --ignore-scripts || npm install --no-audit --no-fund

      - name: Lint
        if: steps.detect.outputs.has_pkg == 'true' && hash_files('**/.eslintrc*') != ''
        run: |
          npm run lint --if-present

      - name: Test
        if: steps.detect.outputs.has_pkg == 'true'
        run: |
          npm test --if-present --silent || true

      - name: Docker build
        if: steps.detect.outputs.has_dockerfile == 'true'
        run: |
          docker build -t ft_transcendence:test .
