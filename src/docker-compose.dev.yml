services:
  backend:
    container_name: backend_dev
    build: ./backend/.
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./frontend/dist:/app/frontend/dist
      - transcendence_db:/app/database
    environment:
      - NODE_ENV=development
      - FORCE_COLOR=1
      - DATABASE_PATH=/app/database/database.db
    tty: true
    restart: unless-stopped
    networks:
      - transcendence_dev

  frontend:
    build: 
      context: ./frontend/
      dockerfile: Dockerfile.dev
    container_name: frontend_dev
    ports:
      - "5173:5173"  # Vite dev server port
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped
    networks:
      - transcendence_dev

volumes:
  transcendence_db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: database/

networks:
  transcendence_dev:
    driver: bridge
